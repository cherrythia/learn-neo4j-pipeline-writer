[project]
name = "writer-service"
version = "0.1.0"
description = "Verified, scored writer pipeline from PDF/Excel/Superset sources into Neo4j"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "anthropic>=2.8.0",
    "pypdf>=7.0.1",
    "openpyxl>=3.1.5",
    "sqlalchemy>=2.1.8",
    "alembic>=1.20.1",
    "pymysql>=1.2.4",
    "neo4j>=6.4.1",
]

[project.scripts]
writer-db = "writer_service.governance.migrate:main"
writer-ontology = "writer_service.ontology.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "httpx2>=2.16.0",
    "fpdf2>=2.9.0",
    "types-openpyxl>=3.1.5.20261017",
    "hypothesis>=6.170.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/writer_service", "src/demo_env"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]
markers = [
    "integration: needs live Neo4j/MySQL (skipped when unavailable)",
    "live: calls a real LLM API (skipped unless a test key is set; never in CI)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["writer_service", "demo_env"]
plugins = ["pydantic.mypy"]
