name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Typecheck
        run: uv run mypy
      - name: Test
        env:
          WRITER_LLM_PROVIDER: fake
        run: uv run pytest

  admin-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-ui
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build

  e2e:
    # Playwright smoke test: the built UI against `writer-demo-server` (in-memory, FakeLLM).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Install admin UI and Chromium
        working-directory: admin-ui
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
      - name: Playwright
        working-directory: admin-ui
        run: bunx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            admin-ui/playwright-report
            admin-ui/test-results
          retention-days: 7

  demo-infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait --wait-timeout 240
      - run: ./scripts/smoke_demo.sh
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Integration tests (MySQL)
        run: |
          set -a; . ./.env; set +a
          export WRITER_TEST_MYSQL_URL="mysql+pymysql://writer:${MYSQL_WRITER_PASSWORD}@127.0.0.1:3306/governance_test"
          export WRITER_TEST_NEO4J_URI=bolt://127.0.0.1:7687
          export WRITER_TEST_NEO4J_PASSWORD="${WRITER_NEO4J_PASSWORD}"
          export WRITER_TEST_SOURCE_DB_URL="mysql+pymysql://reader:${MYSQL_READER_PASSWORD}@127.0.0.1:3306/demo_compliance"
          uv run pytest -m integration
      - if: failure()
        run: docker compose logs --tail 100
